<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>404 🕵️‍♂️ Nie znaleziono strony (chyba Bob coś ukradł!)</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #a4e2f4;
            color: #333;
            text-align: center;
            overflow: hidden;
        }

        h1 {
            font-size: 60px;
            margin-top: 50px;
        }

        h2 {
            font-size: 28px;
            margin-bottom: 20px;
        }

        p {
            font-size: 20px;
        }

        .back-btn {
            display: inline-block;
            padding: 12px 25px;
            background-color: #222;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            margin-top: 30px;
            font-size: 18px;
            transition: 0.3s;
        }

        .back-btn:hover {
            background-color: #444;
            transform: scale(1.05);
        }

        /* 🔥 Animowany Bob */
        .bob {
            position: absolute;
            bottom: 0;
            left: -150px;
            width: 120px;
            animation: walk 10s linear infinite;
        }

        @keyframes walk {
            0% { left: -150px; transform: scaleX(1); }
            50% { left: calc(100% + 150px); transform: scaleX(1); }
            51% { transform: scaleX(-1); }
            100% { left: -150px; transform: scaleX(-1); }
        }

        /* 🌙 Efekt latarki */
        .spotlight {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at var(--x, 50%) var(--y, 50%), rgba(255,255,255,0.2), rgba(0,0,0,0.8));
            pointer-events: none;
            transition: background 0.05s;
        }
    </style>
</head>
<body>

    <h1>404 🕵️‍♂️</h1>
    <h2>Wygląda na to, że Bob tu był i coś ukradł...</h2>
    <p>Strona, której szukasz, nie istnieje lub została przeniesiona.</p>

    <a href="index.html" class="back-btn">Wróć do Strefy Gier</a>

    <img src="Bobkoleś.png" alt="Bob The Robber" class="bob">

    <div class="spotlight"></div>

    <script>
        // 🌙 Latarka podąża za kursorem
        const spotlight = document.querySelector('.spotlight');
        document.addEventListener('mousemove', e => {
            spotlight.style.setProperty('--x', `${e.clientX}px`);
            spotlight.style.setProperty('--y', `${e.clientY}px`);
        });
    </script>

</body>
</html>
